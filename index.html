<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Job Watcher</title>
<meta name="description" content="Daily tracker of investment and banking analyst job postings at 25 firms.">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Today</h1>
  <p class="lede" id="runline">Loading the latest run…</p>

  <div class="counts" id="counts"></div>

  <div class="list-head">
    <h2 class="section-title">What changed since the last run</h2>
    <div class="switch" role="group" aria-label="Which postings to list">
      <button type="button" data-mode="role" aria-pressed="true">My role</button>
      <button type="button" data-mode="all" aria-pressed="false">All postings</button>
    </div>
  </div>
  <div class="two-col">
    <section class="panel">
      <h2 id="new-h">New postings</h2>
      <p class="hint">On a board today, not on it yesterday.</p>
      <ul class="postings" id="new"></ul>
      <button type="button" class="more" id="new-more" hidden></button>
    </section>
    <section class="panel">
      <h2 id="gone-h">Removed postings</h2>
      <p class="hint">Taken down today, usually because the job was filled or closed.</p>
      <ul class="postings" id="gone"></ul>
      <button type="button" class="more" id="gone-more" hidden></button>
    </section>
  </div>

  <section class="panel">
    <h2 id="src-h">Job boards</h2>
    <p class="src-line" id="src-line"></p>
    <details class="data">
      <summary>Status of each board</summary>
      <ul class="sources" id="sources"></ul>
    </details>
  </section>
</main>
<script src="app.js"></script>
<script src="today.js"></script>
</body>
</html>
