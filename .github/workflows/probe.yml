name: Probe sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/probe_sources.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe candidate job boards
        run: python tools/probe_sources.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe_results.json
          git commit -m "Probe results for candidate job boards" || echo "No changes"
          git push
